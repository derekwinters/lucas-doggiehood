name: tests

# Runs the two test suites from docs/engineering/testing.md:
#   1. Core NUnit tests — plain dotnet, no Unity install, always run.
#   2. Unity EditMode tests — headless editor via game-ci/unity-test-runner.
#      Requires the UNITY_LICENSE secret (#71); if it is missing the EditMode
#      job fails outright so a "required" check can't go green without the
#      suite actually running (#163).
#
# The EditMode job's verdict comes from the NUnit results XML, not the runner's
# raw exit code: game-ci occasionally returns a nonzero docker exit code during
# editor teardown (license return / batch-mode shutdown) *after* a fully green
# run (#534). The runner step is therefore `continue-on-error`, and
# verify_editmode_results.py re-derives pass/fail from the results — still
# failing when the suite did not run or any test failed (#163 preserved).

on:
  pull_request:
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - "CoreTests/**"
      - ".github/workflows/ci-tests.yml"
      - ".github/scripts/verify_editmode_results.py"
      - ".github/scripts/tests/test_verify_editmode_results.py"
      - ".github/scripts/verify_emulator_build_variant.py"
      - ".github/scripts/tests/test_verify_emulator_build_variant.py"
      - ".github/scripts/verify_release_signature.py"
      - ".github/scripts/tests/test_verify_release_signature.py"
      - ".github/release-cert-sha256.txt"
      - ".github/scripts/tests/fixtures/**"
  push:
    branches:
      - main
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - "CoreTests/**"
      - ".github/workflows/ci-tests.yml"
      - ".github/scripts/verify_editmode_results.py"
      - ".github/scripts/tests/test_verify_editmode_results.py"
      - ".github/scripts/verify_emulator_build_variant.py"
      - ".github/scripts/tests/test_verify_emulator_build_variant.py"
      - ".github/scripts/verify_release_signature.py"
      - ".github/scripts/tests/test_verify_release_signature.py"
      - ".github/release-cert-sha256.txt"
      - ".github/scripts/tests/fixtures/**"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core NUnit tests (no Unity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run Core tests
        run: dotnet test CoreTests/Doggiehood.Core.Tests --logger "console;verbosity=normal"

  editmode-tests:
    name: Unity EditMode tests (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The results gate decides this required check, so its own decision logic
      # is unit-tested here before it is trusted below (same posture as
      # geometry-lint). Pure Python, stdlib only — no Unity, no license needed.
      - name: Unit-test the EditMode results gate
        run: python3 -m unittest discover -s .github/scripts/tests -p "test_verify_editmode_results.py"

      # The release job runs this gate too (and re-tests it there before
      # trusting it), but only at release time — running its tests on every PR
      # is what stops a broken gate from being discovered mid-release (#706).
      - name: Unit-test the emulator build gate
        run: python3 -m unittest discover -s .github/scripts/tests -p "test_verify_emulator_build_variant.py"

      # Same reasoning for the release-signature gate (#630): it decides
      # whether a release may be published, and it also pins the wiring —
      # that both release workflows still hand the keystore to every build
      # step, and that no pull_request-triggered workflow can reach it. A PR
      # that breaks either fails here, not months later at release time.
      - name: Unit-test the release signature gate
        run: python3 -m unittest discover -s .github/scripts/tests -p "test_verify_release_signature.py"

      - name: Check for Unity license secret
        id: license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::error title=EditMode tests cannot run::UNITY_LICENSE secret is not configured, so Unity EditMode tests cannot run and this required check must fail. Generate a Unity Personal activation file and add it as the UNITY_LICENSE repo secret (issue #71)."
            exit 1
          fi

      - name: Cache Unity Library
        if: steps.license.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: Library
          key: unity-library-tests-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            unity-library-tests-

      # continue-on-error: a nonzero docker exit code during editor teardown
      # (after a green run) must not fail the job on its own — the results gate
      # below is the real arbiter. A genuine test failure still fails the gate.
      - name: Run EditMode tests
        id: editmode
        if: steps.license.outputs.present == 'true'
        continue-on-error: true
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          customParameters: -nographics

      - name: Upload test results
        if: always() && steps.license.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: editmode-test-results
          path: artifacts

      # The verdict: pass only if the suite ran and every test passed. Forgives
      # a teardown-only exit code from the runner above; still fails on a real
      # test failure or on missing results (the suite never ran — #163).
      - name: Verify EditMode results
        if: steps.license.outputs.present == 'true'
        run: python3 .github/scripts/verify_editmode_results.py artifacts
