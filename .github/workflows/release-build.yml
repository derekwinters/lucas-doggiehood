name: release-build

# Backfill path: build both final APKs for an already-published release tag and
# attach them to that release as doggiehood-vX.Y.Z.apk (device) and
# doggiehood-vX.Y.Z-emulator.apk (#648). Debug signing, same as all MVP builds.
# Both assets are verified as genuinely distinct builds before either is
# uploaded (#706).
#
# Automated releases no longer trigger this workflow. A release published by
# release-please's GITHUB_TOKEN never fires a `release: published` event
# (GitHub suppresses workflow triggers from GITHUB_TOKEN-initiated events),
# so the APK is now built and attached by the build-and-attach job inside
# release-please.yml, in the same run that creates the release (#357). This
# workflow is retained purely as the manual backfill for a tag whose release
# predates that mechanism, or to re-attach a build on demand.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-build-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  attach-apk:
    name: Attach APK to release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          lfs: true
          fetch-depth: 0

      - name: Check for Unity license secret
        id: license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Release APK skipped::UNITY_LICENSE secret is not configured, so no APK was attached to the release."
          fi

      - name: Compute version
        if: steps.license.outputs.present == 'true'
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building release ${TAG} (versionName ${TAG#v}, versionCode $(git rev-list --count HEAD))"

      - name: Cache Unity Library
        if: steps.license.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: Library
          key: unity-library-android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            unity-library-android-

      # Clearing Unity's incremental player build state before each variant is
      # what keeps the two builds genuinely distinct — see the same steps in
      # release-please.yml and issue #706.
      - name: Reset the incremental Android player build (device)
        if: steps.license.outputs.present == 'true'
        run: sudo rm -rf Library/Bee

      - name: Build Android release APK
        if: steps.license.outputs.present == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildName: Doggiehood
          versioning: Custom
          version: ${{ steps.version.outputs.name }}
          androidVersionCode: ${{ steps.version.outputs.code }}
          androidExportType: androidPackage

      - name: Name the device APK
        if: steps.license.outputs.present == 'true'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          APK="$(find build/Android -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Build completed but no APK found under build/Android"
            exit 1
          fi
          sudo mv "$APK" "doggiehood-${TAG}.apk"

      - name: Reset the incremental Android player build (emulator)
        if: steps.license.outputs.present == 'true'
        run: sudo rm -rf Library/Bee

      # The backfill builds *both* release assets, so re-running it for a tag
      # is enough to replace a bad emulator asset — v0.14.0's is a copy of the
      # device APK (#706) and v0.15.0 has no assets at all (#731), and this is
      # the path that fixes both.
      #
      # As in release-please.yml, the variant is requested with
      # `customParameters` rather than a step `env:` entry: unity-builder runs
      # Unity inside a Docker container that receives only an allowlist of
      # variables, so a repo-specific one never arrives, while
      # `customParameters` is appended straight to the unity-editor command
      # line (#731).
      - name: Build Android emulator APK
        if: steps.license.outputs.present == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildName: Doggiehood
          buildsPath: build-emulator
          customParameters: -doggiehoodEmulatorBuild
          versioning: Custom
          version: ${{ steps.version.outputs.name }}
          androidVersionCode: ${{ steps.version.outputs.code }}
          androidExportType: androidPackage

      - name: Name the emulator APK
        if: steps.license.outputs.present == 'true'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          APK="$(find build-emulator/Android -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Emulator build completed but no APK found under build-emulator/Android"
            exit 1
          fi
          sudo mv "$APK" "doggiehood-${TAG}-emulator.apk"

      - name: Unit-test the emulator build gate
        if: steps.license.outputs.present == 'true'
        run: python3 -m unittest discover -s .github/scripts/tests -p "test_verify_emulator_build_variant.py"

      - name: Verify the emulator APK is a real emulator build
        if: steps.license.outputs.present == 'true'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 .github/scripts/verify_emulator_build_variant.py \
            "doggiehood-${TAG}.apk" "doggiehood-${TAG}-emulator.apk"

      - name: Attach both APKs to the release
        if: steps.license.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" "doggiehood-${TAG}.apk" --clobber
          gh release upload "$TAG" "doggiehood-${TAG}-emulator.apk" --clobber
