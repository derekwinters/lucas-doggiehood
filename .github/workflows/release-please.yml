name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

  # When release-please publishes a GitHub release (tag vX.Y.Z), build the
  # final APK for that tag and attach it to the release as
  # doggiehood-vX.Y.Z.apk — so every release page carries its installable
  # build. This runs inside the same workflow run that created the release,
  # because a release published by release-please's GITHUB_TOKEN never fires
  # a separate `release: published` workflow (see #357). Both assets are
  # signed with the stable release keystore (#630).
  build-and-attach:
    name: Build and attach APK to release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # contents: write (declared at workflow level above) covers the release upload.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          lfs: true
          fetch-depth: 0

      - name: Check for Unity license secret
        id: license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Release APK skipped::UNITY_LICENSE secret is not configured, so no APK was attached to the release."
          fi

      # A release must never be built without the release key. The
      # UNITY_LICENSE check above warns and skips, because no APK is a
      # tolerable outcome; a *debug-signed* APK is not — it installs fine,
      # looks correct, and quietly makes every future upgrade impossible. So
      # this one fails the job outright (#630).
      - name: Check for the release keystore secret
        if: steps.license.outputs.present == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error title=Release keystore missing::The release signing secrets are not configured (#629). Refusing to build a release APK that would fall back to debug signing and break in-place upgrades."
            exit 1
          fi

      - name: Compute version
        if: steps.license.outputs.present == 'true'
        id: version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building release ${TAG} (versionName ${TAG#v}, versionCode $(git rev-list --count HEAD))"

      - name: Cache Unity Library
        if: steps.license.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: Library
          key: unity-library-android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            unity-library-android-

      # Unity's Bee/Tundra player build is incremental and keys its cache off
      # on-disk content, not live PlayerSettings. Two variant builds sharing
      # one Library therefore serve the second from the first's compiled
      # player — which is exactly how v0.14.0 shipped an "emulator" APK that
      # was a byte-for-byte copy of the device APK (#706). Clearing the player
      # build state before *each* build makes that impossible in either
      # direction, including across a restored Library cache.
      - name: Reset the incremental Android player build (device)
        if: steps.license.outputs.present == 'true'
        run: sudo rm -rf Library/Bee

      - name: Build Android release APK
        if: steps.license.outputs.present == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildName: Doggiehood
          versioning: Custom
          version: ${{ steps.version.outputs.name }}
          androidVersionCode: ${{ steps.version.outputs.code }}
          androidExportType: androidPackage
          # Sign with the stable release key (#630). Without these inputs Unity
          # falls back to Android's debug key and produces an APK that can
          # never be installed over an existing release — the upgrade would
          # force an uninstall and wipe the player's save. The keystore itself
          # is an encrypted secret (#629); nothing is committed.
          androidKeystoreName: doggiehood-release.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEY_ALIAS }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}

      - name: Name the device APK
        if: steps.license.outputs.present == 'true'
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          APK="$(find build/Android -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Build completed but no APK found under build/Android"
            exit 1
          fi
          sudo mv "$APK" "doggiehood-${TAG}.apk"

      - name: Reset the incremental Android player build (emulator)
        if: steps.license.outputs.present == 'true'
        run: sudo rm -rf Library/Bee

      # Second, emulator-targeted variant (#648). EmulatorBuildProcessor
      # flips the ABI to x86_64-only and pins the emulator-safe graphics
      # profile (Vulkan→GLES3, no wide colour gamut, no multithreaded
      # rendering) plus a disabled audio engine for this run only, then
      # restores them — the device APK built above stays ARM64-only with the
      # committed defaults. Built into its own buildsPath so the two APKs can
      # never be confused. Signed with the same release key as the device
      # APK (#630) — it is a release asset too.
      #
      # The variant is requested with `customParameters`, NOT with a step
      # `env:` entry (#731). unity-builder does not run Unity in this step's
      # process — it runs it inside a Docker container and forwards only a
      # fixed allowlist of variables, so `DOGGIEHOOD_EMULATOR_BUILD: "true"`
      # (what this step used to carry) was set on the runner and never inside
      # the container: the processor no-op'd and v0.15.0's "emulator" APK was
      # a second device build. `customParameters` is forwarded as
      # CUSTOM_PARAMETERS and appended verbatim to the unity-editor command
      # line, which is where EmulatorBuildProcessor now reads the switch from.
      - name: Build Android emulator APK
        if: steps.license.outputs.present == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildName: Doggiehood
          buildsPath: build-emulator
          customParameters: -doggiehoodEmulatorBuild
          versioning: Custom
          version: ${{ steps.version.outputs.name }}
          androidVersionCode: ${{ steps.version.outputs.code }}
          androidExportType: androidPackage
          # Sign with the stable release key (#630). Without these inputs Unity
          # falls back to Android's debug key and produces an APK that can
          # never be installed over an existing release — the upgrade would
          # force an uninstall and wipe the player's save. The keystore itself
          # is an encrypted secret (#629); nothing is committed.
          androidKeystoreName: doggiehood-release.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEY_ALIAS }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}

      - name: Name the emulator APK
        if: steps.license.outputs.present == 'true'
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          APK="$(find build-emulator/Android -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Emulator build completed but no APK found under build-emulator/Android"
            exit 1
          fi
          sudo mv "$APK" "doggiehood-${TAG}-emulator.apk"

      # The gate's own decision logic is unit-tested before it is trusted,
      # same posture as the EditMode results gate and the geometry lint.
      - name: Unit-test the emulator build gate
        if: steps.license.outputs.present == 'true'
        run: python3 -m unittest discover -s .github/scripts/tests -p "test_verify_emulator_build_variant.py"

      # Nothing is uploaded until both APKs are proven to be different builds
      # carrying the right applicationId and ABIs — a release page must never
      # serve a mislabelled asset (#706).
      - name: Verify the emulator APK is a real emulator build
        if: steps.license.outputs.present == 'true'
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          python3 .github/scripts/verify_emulator_build_variant.py \
            "doggiehood-${TAG}.apk" "doggiehood-${TAG}-emulator.apk"

      # The gate's own decision logic is unit-tested before it is trusted,
      # same posture as the emulator gate above.
      - name: Unit-test the release signature gate
        if: steps.license.outputs.present == 'true'
        run: python3 -m unittest discover -s .github/scripts/tests -p "test_verify_release_signature.py"

      # Nothing is uploaded until both assets are proven to carry the pinned
      # release certificate. A debug-signed asset that reaches the release
      # page cannot be taken back once someone installs it (#630).
      - name: Verify the release signature
        if: steps.license.outputs.present == 'true'
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          python3 .github/scripts/verify_release_signature.py \
            "doggiehood-${TAG}.apk" "doggiehood-${TAG}-emulator.apk"

      - name: Attach both APKs to the release
        if: steps.license.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" "doggiehood-${TAG}.apk" --clobber
          gh release upload "$TAG" "doggiehood-${TAG}-emulator.apk" --clobber
