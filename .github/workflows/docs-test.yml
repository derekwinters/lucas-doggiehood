name: docs-test

# The `build` job runs on EVERY pull request (no path filter) so it can report a
# status on code-only PRs too. Behavior:
#   - PR touches docs -> run `mkdocs build --strict` (as before).
#   - PR is release-please's auto-generated release PR -> pass (it only bumps
#     VERSION/CHANGELOG/manifest and can never carry docs or a hand-added label).
#   - PR touches no docs but carries the `skip-docs` label -> pass (deliberate escape hatch).
#   - PR touches no docs and has no label -> fail, asking for a docs reconciliation or the label.
#
# `skip-docs` cannot be set atomically at PR creation (pipeline-dev opens the PR,
# then labels it a moment later), and this workflow triggers on both `opened` and
# `labeled`. To avoid a transient failed run on the `opened` event before the
# label lands (#254 — that superseded run fired spurious CI-failure webhooks), the
# reconciliation gate's decision lives in `.github/scripts/docs_reconciliation_gate.py`:
# when the triggering payload has no `skip-docs`, it polls the PR's LIVE labels for a
# short grace window before failing, so the same `opened` run observes the label and
# passes — no failing run is ever produced. `labeled`/`unlabeled` stay in the trigger
# list so manually toggling `skip-docs` still re-evaluates the gate without a new push.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  # The reconciliation gate re-fetches the PR's live labels via `gh api` to
  # absorb the opened/labeled race (#254).
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine whether the PR touches docs
        id: docs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" \
            | grep -qE '^(docs/|mkdocs\.yml|\.github/workflows/docs-(test|publish)\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine whether this is release-please's release PR
        id: release
        env:
          HEAD_REF: ${{ github.head_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          # release-please's release PR is mechanical (VERSION/CHANGELOG/manifest
          # only) and cannot reconcile docs or self-apply skip-docs, so it is
          # exempt from the docs-reconciliation gate. Match on its deterministic
          # head branch (release-please--branches--<target>) OR its own
          # `autorelease: pending` label, either of which uniquely identifies it.
          if [ "${HEAD_REF#release-please--branches--}" != "$HEAD_REF" ] \
            || printf '%s' "$LABELS" | grep -q '"autorelease: pending"'; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Docs-touching PR: build the site strictly, exactly as before. ---
      - name: Set up Python
        if: steps.docs.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        if: steps.docs.outputs.changed == 'true'
        run: pip install -r docs/requirements.txt

      - name: Build site (strict)
        if: steps.docs.outputs.changed == 'true'
        run: mkdocs build --strict

      # --- Code-only PR: pass only if the docs decision was made deliberately. ---
      # The decision (and its live-label grace poll for the opened/labeled race)
      # lives in a unit-tested script — see the `gate-tests` job below.
      - name: Docs reconciliation gate
        if: steps.docs.outputs.changed != 'true'
        env:
          DOCS_CHANGED: ${{ steps.docs.outputs.changed }}
          IS_RELEASE: ${{ steps.release.outputs.is_release }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/docs_reconciliation_gate.py

  # Unit tests for the reconciliation gate's decision logic. Runs on every PR
  # (alongside `build`) so the decision that gates every PR is always validated.
  gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run docs-reconciliation gate unit tests
        run: python3 -m unittest discover -s .github/scripts/tests
