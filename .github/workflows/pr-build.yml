name: pr-build

# Builds a debug Android APK for every PR (#75) — every PR, not only the ones
# touching app/build files, because "Debug APK" is a required check (#751).
#   - versionName = VERSION file + short commit SHA, e.g. 0.1.0-a1b2c3d
#   - versionCode = total commit count (git rev-list --count HEAD) (#81) —
#     deterministic, strictly increasing as commits land, and independent of
#     both versionName and any CI run-number state
#   - Android default debug signing (no keystore secrets — deliberate)
#   - APK uploaded as a workflow artifact only (no store/Firebase distribution)
#
# Requires the UNITY_LICENSE secret (#71). Until it exists the build job
# emits a loud warning instead of failing every PR.

on:
  # No path filter, deliberately (#751). "Debug APK" is a required status check
  # on `main`, so it has to report on every PR — including the `.github/**`-
  # and `docs/**`-only PRs the old `Assets/**`/`Packages/**`/`ProjectSettings/**`
  # /`VERSION` allowlist excluded, which could never become mergeable. See the
  # note on `ci-tests.yml` and
  # `.github/scripts/tests/test_required_checks_reachable.py`.
  pull_request:

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          # Full history so `git rev-list --count` reflects the real commit
          # count rather than a shallow-clone depth (#81).
          fetch-depth: 0

      - name: Check for Unity license secret
        id: license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=PR APK build skipped::UNITY_LICENSE secret is not configured, so no debug APK was built. Generate a Unity Personal activation file and add it as the UNITY_LICENSE repo secret (issue #71)."
          fi

      - name: Compute versionName and versionCode
        if: steps.license.outputs.present == 'true'
        id: version
        run: |
          # VERSION's first field is the bare semver; anything after it is the
          # "# x-release-please-version" marker comment release-please's
          # generic extra-files updater needs to find the line to rewrite (#114).
          BASE_VERSION="$(cut -d'#' -f1 < VERSION | tr -d '[:space:]')"
          # github.sha on a PR is the synthetic merge commit; use the real
          # head commit so the APK is traceable to what's in the PR.
          SHORT_SHA="$(git rev-parse --short "${{ github.event.pull_request.head.sha }}")"
          VERSION_NAME="${BASE_VERSION}-${SHORT_SHA}"
          VERSION_CODE="$(git rev-list --count HEAD)"
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Building versionName=${VERSION_NAME} versionCode=${VERSION_CODE}"

      - name: Cache Unity Library
        if: steps.license.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: Library
          key: unity-library-android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            unity-library-android-

      # The .debug applicationId suffix (#80) is requested with
      # `customParameters`, NOT with a step `env:` entry (#734). unity-builder
      # does not run Unity in this step's process — it runs it inside a Docker
      # container and forwards only a fixed allowlist of variables, so
      # `DOGGIEHOOD_DEBUG_BUILD: "true"` (what this step used to carry) was set
      # on the runner and never inside the container: the hook no-op'd and
      # every PR APK shipped the bare release id, which would replace a release
      # install rather than sit beside it. `customParameters` is forwarded as
      # CUSTOM_PARAMETERS and appended verbatim to the unity-editor command
      # line, which is where DebugApplicationIdBuildProcessor now reads it.
      - name: Build Android debug APK
        if: steps.license.outputs.present == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildName: Doggiehood
          customParameters: -doggiehoodDebugBuild
          versioning: Custom
          version: ${{ steps.version.outputs.name }}
          androidVersionCode: ${{ steps.version.outputs.code }}
          androidExportType: androidPackage

      # The gate's own decision logic is unit-tested before it is trusted, same
      # posture as the emulator and release-signature gates.
      - name: Unit-test the debug applicationId gate
        if: steps.license.outputs.present == 'true'
        run: python3 -m unittest discover -s .github/scripts/tests -p "test_verify_debug_application_id.py"

      # Nothing is uploaded until the APK is proven to carry the .debug id.
      # #734 went unnoticed for as long as it did precisely because nothing
      # ever checked; a silent no-op now fails the job instead of shipping a
      # mislabelled APK.
      - name: Verify the debug applicationId suffix applied
        if: steps.license.outputs.present == 'true'
        run: |
          APK="$(find build/Android -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Build completed but no APK found under build/Android"
            exit 1
          fi
          python3 .github/scripts/verify_debug_application_id.py "$APK"

      - name: Upload APK artifact
        if: steps.license.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: doggiehood-debug-${{ steps.version.outputs.name }}
          path: build/Android
